<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

    
<!-- LOGIN FORM -->
<div class="login-box" id="loginBox">

  <img src="https://media.tenor.com/1TUcPuFX-WMAAAAM/kitty-kitten.gif" alt="Cute kitten GIF" class="login-gif">

  <h2>Hello Lovey ✨</h2>

  <p class="sweet-text">

  <input type="password"
  id="username"
  placeholder="Enter here...">

  <button onclick="login()">Open</button>

</div>


<!-- WEBSITE CONTENT -->
<div id="websiteContent">

  <header>
    <h1>My Personal Website</h1>

    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="letter.html">Letter</a>

    </nav>
  </header>


  <section class="home">

    <img src="https://media.tenor.com/_ZbCnr3xZcgAAAAM/kiss-love.gif"
    alt="Welcome GIF"
    class="home-gif">

    <h2>Welcome to My Website</h2>

    <p>
      HAPPY MONTHSARY lOVEY🥰
    </p>

  </section>

<div class="home-gallery">

  <img src="10.jpeg" alt="pic1">  
  <img src="11.jpeg" alt="pic2">
  <img src="12.jpeg" alt="pic3">
  <img src="13.jpeg" alt="pic4">

</div>

    <span style="--i:0"><img src="1.jpeg"></span>

    <span style="--i:6"><img src="7.jpeg"></span>
